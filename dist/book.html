<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1a6deb" />
    <meta name="author" content="UpNexa-eg.com" />
    <meta name="description" content="موظف الاستقبال الرقمي — احجز عبر موعد Maw3ed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>حجز موعد — موعد Maw3ed</title>
    <link rel="icon" type="image/svg+xml" href="/assets/maw3ed-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#13233f; --muted:#7b889e; --line:#e7edf5; --blue:#1a6deb; --card:#fff; --keyboard-inset:0px; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Cairo, "IBM Plex Sans Arabic", Tahoma, sans-serif; background: linear-gradient(180deg,#eaf2ff,#f6f8fb); color: var(--ink); }
      .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px calc(64px + var(--keyboard-inset)); transition: padding-bottom .15s ease; }
      .hero { display: grid; gap: 8px; margin-bottom: 14px; }
      .hero .eyebrow { color: var(--blue); font-weight: 700; }
      .hero h1 { margin: 0; font-size: clamp(1.7rem,4vw,2.35rem); letter-spacing: -.04em; }
      .hero p, .meta { margin: 0; color: var(--muted); }
      .hero-logo { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 2px solid #dbe7ff; background: #fff; }
      .steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
      .steps span { padding: 6px 10px; border-radius: 999px; background: #eaf1fb; color: var(--muted); font-size: .78rem; font-weight: 700; }
      .steps span.on { background: var(--blue); color: #fff; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgba(19,52,100,.06); margin-bottom: 12px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      .chip, .slot, .pick { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 12px; font: inherit; cursor: pointer; }
      .chip.on, .slot.on, .pick.on { border-color: var(--blue); background: #eef5ff; color: var(--blue); font-weight: 700; }
      .pick { width: 100%; border-radius: 12px; display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 8px; text-align: start; }
      .slots { display: flex; flex-wrap: wrap; gap: 8px; }
      .stack label { display: grid; gap: 6px; margin-bottom: 10px; font-weight: 600; font-size: .92rem; }
      .stack input, .stack textarea { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      .cta, .ghost { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 800; cursor: pointer; font: inherit; }
      .cta { background: linear-gradient(120deg,#0d4bb8,#1a6deb); color: #fff; }
      .ghost { background: #eaf1fb; color: var(--ink); }
      button:disabled { opacity: .55; cursor: not-allowed; }
      .ok { border-color: #b7e4c7; background: #f0fff4; }
      .err { color: #b42318; font-weight: 700; }
      .foot { margin-top: 16px; color: var(--muted); font-size: .85rem; }
      .muted { color: var(--muted); font-size: .85rem; }
      .keyboard-spacer { height: var(--keyboard-inset); min-height: var(--keyboard-inset); width: 100%; pointer-events: none; transition: height .15s ease; }
    </style>
  </head>
  <body>
    <div class="wrap" id="app">جارٍ تجهيز موظف الاستقبال الرقمي...</div>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const slug = params.get("slug") || "maw3ed-demo";
      const browserLang = (navigator.language || "ar").toLowerCase();
      if (!browserLang.startsWith("ar") && !browserLang.startsWith("ur")) {
        document.documentElement.lang = "en";
        document.documentElement.dir = "ltr";
      }
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

      (function bindKeyboardInset() {
        const root = document.documentElement;
        const FOCUSABLE = "input, textarea, select, [contenteditable='true']";
        let frame = 0;
        const apply = () => {
          cancelAnimationFrame(frame);
          frame = requestAnimationFrame(() => {
            const vv = window.visualViewport;
            if (!vv) {
              root.style.setProperty("--keyboard-inset", "0px");
              return;
            }
            const inset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
            const value = inset > 60 ? Math.round(inset) : 0;
            root.style.setProperty("--keyboard-inset", `${value}px`);
            root.classList.toggle("keyboard-open", value > 0);
          });
        };
        const onFocusIn = (event) => {
          apply();
          const target = event.target;
          if (!target?.matches?.(FOCUSABLE) && !target?.closest?.(FOCUSABLE)) return;
          const el = target.matches?.(FOCUSABLE) ? target : target.closest(FOCUSABLE);
          window.setTimeout(() => {
            try { el.scrollIntoView({ block: "center", inline: "nearest", behavior: "smooth" }); }
            catch { el.scrollIntoView(true); }
          }, 120);
        };
        const vv = window.visualViewport;
        vv?.addEventListener("resize", apply);
        vv?.addEventListener("scroll", apply);
        window.addEventListener("resize", apply);
        window.addEventListener("orientationchange", apply);
        document.addEventListener("focusin", onFocusIn);
        document.addEventListener("focusout", apply);
        apply();
      })();

      const state = {
        step: 1,
        data: null,
        categoryId: "all",
        serviceId: "",
        staffId: "any",
        date: new Date().toISOString().slice(0, 10),
        time: "",
        slots: [],
        loadingSlots: false,
        customerName: "",
        phone: "",
        email: "",
        notes: "",
        result: null,
        error: ""
      };
      const root = document.getElementById("app");

      const services = () => (state.data?.services || []).filter((service) => state.categoryId === "all" || service.categoryId === state.categoryId);
      const service = () => (state.data?.services || []).find((item) => item.id === state.serviceId);
      const staffForService = () => {
        const item = service();
        const ids = item?.providerIds || [];
        const all = state.data?.staff || [];
        return ids.length ? all.filter((person) => ids.includes(person.id)) : all;
      };

      async function loadSlots() {
        if (!state.serviceId || !state.date) return;
        state.loadingSlots = true;
        state.error = "";
        render();
        try {
          const query = new URLSearchParams({ date: state.date, serviceId: state.serviceId, staffId: state.staffId || "any" });
          const response = await fetch(`/api/public/booking/${encodeURIComponent(slug)}/slots?${query}`);
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || "تعذر تحميل الأوقات");
          state.slots = payload.slots || [];
          if (!state.slots.some((slot) => slot.time === state.time)) state.time = "";
        } catch (error) {
          state.slots = [];
          state.error = error.message;
        } finally {
          state.loadingSlots = false;
          render();
        }
      }

      function render() {
        if (state.error && !state.data) {
          root.innerHTML = `<p class="err">${state.error}</p>`;
          return;
        }
        const page = state.data.page;
        const categories = state.data.categories || [];
        const list = services();
        const selected = service();

        root.innerHTML = `
          <section class="hero">
            ${page.logoUrl ? `<img class="hero-logo" src="${page.logoUrl}" alt="" />` : ""}
            <div class="eyebrow">${page.industry || "حجز إلكتروني"} · موظف استقبال رقمي 24/7</div>
            <h1>${page.businessName || "موعد"}</h1>
            <p>${page.description || ""}</p>
            <div class="meta">${page.phone || ""} · ${page.email || ""} · ${[page.city, page.country].filter(Boolean).join("، ")}</div>
          </section>
          <div class="steps">
            <span class="${state.step === 1 ? "on" : ""}">1. الهوية</span>
            <span class="${state.step === 2 ? "on" : ""}">2. الخدمة</span>
            <span class="${state.step === 3 ? "on" : ""}">3. الموظف</span>
            <span class="${state.step === 4 ? "on" : ""}">4. الوقت</span>
            <span class="${state.step === 5 ? "on" : ""}">5. بياناتك</span>
            <span class="${state.step === 6 ? "on" : ""}">6. تأكيد</span>
          </div>

          ${state.step === 1 ? `
            <section class="card">
              <h2 style="margin-top:0">مرحباً بك في ${page.businessName || "موعد"}</h2>
              <p class="muted">احجز خلال أقل من دقيقة. لن ترى إلا الأوقات المتاحة فعلياً بعد خصم الحجوزات وأوقات الراحة.</p>
              <div class="actions"><button class="cta" id="to2">ابدأ اختيار الخدمة</button></div>
            </section>` : ""}

          ${state.step === 2 ? `
            <section class="card">
              <h2 style="margin-top:0">الأقسام والخدمات</h2>
              <div class="chips">
                <button type="button" class="chip ${state.categoryId === "all" ? "on" : ""}" data-cat="all">الكل</button>
                ${categories.map((category) => `<button type="button" class="chip ${state.categoryId === category.id ? "on" : ""}" data-cat="${category.id}">${category.name}</button>`).join("")}
              </div>
              ${list.map((item) => `
                <button type="button" class="pick ${state.serviceId === item.id ? "on" : ""}" data-service="${item.id}">
                  <div><b>${item.name}</b><div class="muted">${item.durationMinutes} د${item.bufferMinutes ? ` · فاصل ${item.bufferMinutes}د` : ""}</div></div>
                  <div><b>${
                    item.pricingType === "free" ? "مجاني"
                    : item.pricingType === "on_request" ? "عند الطلب"
                    : item.pricingType === "range" ? `E£${item.priceMin ?? item.price ?? 0}–${item.priceMax ?? item.price ?? 0}`
                    : item.price ? `E£${item.price}` : "مجاني"
                  }</b></div>
                </button>
              `).join("") || "<p>لا توجد خدمات في هذا القسم.</p>"}
              <div class="actions">
                <button class="ghost" id="back1">رجوع</button>
                <button class="cta" id="to3" ${state.serviceId ? "" : "disabled"}>التالي</button>
              </div>
            </section>` : ""}

          ${state.step === 3 ? `
            <section class="card">
              <h2 style="margin-top:0">مقدّم الخدمة</h2>
              <button type="button" class="pick ${state.staffId === "any" ? "on" : ""}" data-staff="any">
                <div><b>أي متاح</b><div class="muted">نسند أول موظف حر في الوقت الذي تختاره</div></div>
              </button>
              ${staffForService().map((person) => `
                <button type="button" class="pick ${state.staffId === person.id ? "on" : ""}" data-staff="${person.id}">
                  <div><b>${person.name}</b><div class="muted">${person.title || ""}</div></div>
                </button>
              `).join("")}
              <div class="actions">
                <button class="ghost" id="back2">رجوع</button>
                <button class="cta" id="to4">اختيار التاريخ</button>
              </div>
            </section>` : ""}

          ${state.step === 4 ? `
            <section class="card stack">
              <h2 style="margin-top:0">التاريخ والوقت المتاح</h2>
              <p class="muted">${selected ? `${selected.name} · كتلة ${Number(selected.durationMinutes || 0) + Number(selected.bufferMinutes || 0)} دقيقة` : ""}</p>
              <label>اليوم<input type="date" id="date" value="${state.date}" /></label>
              <div>
                <b>الأوقات المتاحة</b>
                <div class="slots" style="margin-top:8px">
                  ${state.loadingSlots ? "<span class='muted'>جارٍ الحساب...</span>" : ""}
                  ${!state.loadingSlots && !state.slots.length ? "<span class='muted'>لا توجد أوقات في هذا اليوم</span>" : ""}
                  ${state.slots.map((slot) => `<button type="button" class="slot ${state.time === slot.time ? "on" : ""}" data-time="${slot.time}" data-slot-staff="${slot.staffId}">${slot.time}${state.staffId === "any" ? ` · ${slot.staffName}` : ""}</button>`).join("")}
                </div>
              </div>
              ${state.error ? `<p class="err">${state.error}</p>` : ""}
              <div class="actions">
                <button class="ghost" id="back3">رجوع</button>
                <button class="cta" id="to5" ${state.time ? "" : "disabled"}>التالي</button>
              </div>
            </section>` : ""}

          ${state.step === 5 ? `
            <section class="card stack">
              <h2 style="margin-top:0">بياناتك</h2>
              <label>الاسم الكامل<input id="name" value="${state.customerName}" placeholder="مثال: سارة أحمد" /></label>
              <label>الهاتف<input id="phone" value="${state.phone}" placeholder="01xxxxxxxxx" /></label>
              <label>البريد<input id="email" value="${state.email}" placeholder="optional@email.com" /></label>
              <label>ملاحظات<textarea id="notes" rows="3" placeholder="تأمين / شكوى / تفضيل...">${state.notes}</textarea></label>
              <p class="muted">${
                selected?.pricingType === "range"
                  ? `تسعير بنطاق: يُعرض ${selected.priceMin ?? 0}–${selected.priceMax ?? 0}، ويُسجَّل عربون أولي = الحد الأدنى عند التأكيد. السعر النهائي يُثبَّت بعد المعاينة.`
                  : selected?.pricingType === "on_request"
                    ? "تسعير عند الطلب: الحجز بلا مبلغ مسبق. يرسل مقدّم الخدمة عرض سعر لاحقاً للموافقة."
                    : selected?.pricingType === "free"
                      ? "هذه الخدمة مجانية."
                      : "الدفع الإلكتروني الكامل سيُفعَّل حسب خطة المنشأة؛ حالياً يُسجَّل المبلغ مع الموعد."
              }</p>
              <div class="actions">
                <button class="ghost" id="back4">رجوع</button>
                <button class="cta" id="to6">مراجعة</button>
              </div>
            </section>` : ""}

          ${state.step === 6 ? `
            <section class="card ${state.result ? "ok" : ""}">
              <h2 style="margin-top:0">${state.result ? "تم تأكيد الحجز" : "تأكيد الحجز"}</h2>
              ${state.result ? `
                <p>المرجع: <b>${state.result.id}</b></p>
                <p>${state.result.serviceName} · ${state.result.date} · ${state.result.time}</p>
                <p>مع: ${state.result.staffName} · الحالة: ${state.result.status}</p>
                <p>${
                  state.result.pricingType === "on_request" && state.result.pricingStatus === "quote_pending"
                    ? "السعر: عند الطلب — بانتظار عرض من المقدّم"
                    : state.result.pricingType === "range"
                      ? `المبلغ المسجّل: E£${state.result.amount ?? 0} (نطاق ${state.result.priceMin ?? 0}–${state.result.priceMax ?? 0})`
                      : state.result.pricingType === "free" || Number(state.result.amount) === 0
                        ? "المبلغ: مجاني"
                        : `المبلغ: E£${state.result.amount ?? 0}`
                }</p>
              ` : `
                <p><b>${selected?.name || ""}</b></p>
                <p>${state.date} · ${state.time}</p>
                <p>${state.staffId === "any" ? "أي متاح" : (staffForService().find((p) => p.id === state.staffId)?.name || "")}</p>
                <p>${state.customerName} · ${state.phone}</p>
                <p class="muted">${
                  selected?.pricingType === "range"
                    ? `عربون أولي متوقع: E£${selected.priceMin ?? 0} ضمن نطاق ${selected.priceMin ?? 0}–${selected.priceMax ?? 0}`
                    : selected?.pricingType === "on_request"
                      ? "بدون مبلغ مسبق — عرض سعر لاحقاً"
                      : selected?.pricingType === "free"
                        ? "مجاني"
                        : selected?.price != null ? `المبلغ: E£${selected.price}` : ""
                }</p>
                ${state.error ? `<p class="err">${state.error}</p>` : ""}
                <div class="actions">
                  <button class="ghost" id="back5">رجوع</button>
                  <button class="cta" id="submit">تأكيد وإرسال</button>
                </div>
              `}
            </section>` : ""}

          <p class="foot">${page.showPlatformBranding !== false ? "منصة موعد – مدعوم من UpNexa-eg.com<br/><a href=\"mailto:contact@upnexa-eg.com\">contact@upnexa-eg.com</a>" : ""}</p>
        `;

        root.querySelectorAll("[data-cat]").forEach((button) => button.addEventListener("click", () => {
          state.categoryId = button.getAttribute("data-cat");
          if (state.serviceId && !services().some((item) => item.id === state.serviceId)) state.serviceId = "";
          render();
        }));
        root.querySelectorAll("[data-service]").forEach((button) => button.addEventListener("click", () => {
          state.serviceId = button.getAttribute("data-service");
          state.staffId = "any";
          render();
        }));
        root.querySelectorAll("[data-staff]").forEach((button) => button.addEventListener("click", () => {
          state.staffId = button.getAttribute("data-staff");
          render();
        }));
        root.querySelectorAll("[data-time]").forEach((button) => button.addEventListener("click", () => {
          state.time = button.getAttribute("data-time");
          if (state.staffId === "any") state.heldStaffId = button.getAttribute("data-slot-staff");
          render();
        }));

        document.getElementById("to2")?.addEventListener("click", () => { state.step = 2; render(); });
        document.getElementById("back1")?.addEventListener("click", () => { state.step = 1; render(); });
        document.getElementById("to3")?.addEventListener("click", () => { state.step = 3; render(); });
        document.getElementById("back2")?.addEventListener("click", () => { state.step = 2; render(); });
        document.getElementById("to4")?.addEventListener("click", async () => { state.step = 4; await loadSlots(); });
        document.getElementById("back3")?.addEventListener("click", () => { state.step = 3; render(); });
        document.getElementById("date")?.addEventListener("change", async (event) => {
          state.date = event.target.value;
          await loadSlots();
        });
        document.getElementById("to5")?.addEventListener("click", async () => {
          const holdStaffId = state.staffId === "any" ? (state.heldStaffId || "any") : state.staffId;
          try {
            const holdResponse = await fetch(`/api/public/booking/${encodeURIComponent(slug)}/hold`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                date: state.date,
                serviceId: state.serviceId,
                staffId: holdStaffId,
                time: state.time
              })
            });
            const holdPayload = await holdResponse.json().catch(() => ({}));
            if (holdResponse.ok && holdPayload.staffId) state.heldStaffId = holdPayload.staffId;
          } catch (_) {}
          state.step = 5;
          render();
        });
        document.getElementById("back4")?.addEventListener("click", () => { state.step = 4; render(); });
        document.getElementById("to6")?.addEventListener("click", () => {
          state.customerName = document.getElementById("name").value.trim();
          state.phone = document.getElementById("phone").value.trim();
          state.email = document.getElementById("email").value.trim();
          state.notes = document.getElementById("notes").value.trim();
          if (!state.customerName || !state.phone) { alert("الاسم والهاتف مطلوبان"); return; }
          state.step = 6;
          state.error = "";
          render();
        });
        document.getElementById("back5")?.addEventListener("click", () => { state.step = 5; render(); });
        document.getElementById("submit")?.addEventListener("click", async () => {
          const button = document.getElementById("submit");
          button.disabled = true;
          try {
            const response = await fetch(`/api/public/booking/${encodeURIComponent(slug)}/appointments`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                serviceId: state.serviceId,
                staffId: state.staffId === "any" ? (state.heldStaffId || "any") : state.staffId,
                date: state.date,
                time: state.time,
                customerName: state.customerName,
                phone: state.phone,
                email: state.email,
                notes: state.notes
              })
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.error || "فشل التأكيد");
            state.result = payload.appointment;
            state.error = "";
          } catch (error) {
            state.error = error.message;
          }
          render();
        });
      }

      try {
        const response = await fetch(`/api/public/booking/${encodeURIComponent(slug)}`);
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "تعذر فتح صفحة الحجز");
        state.data = payload;
        state.serviceId = payload.services?.[0]?.id || "";
        render();
      } catch (error) {
        state.error = error.message;
        render();
      }
    </script>
  </body>
</html>
