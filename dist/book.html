<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a6deb" />
    <meta name="author" content="UpNexa-eg.com" />
    <meta name="description" content="احجز عبر موعد Maw3ed — منتج من UpNexa-eg.com" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>حجز موعد — موعد Maw3ed</title>
    <link rel="icon" type="image/svg+xml" href="/assets/maw3ed-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#13233f; --muted:#7b889e; --line:#e7edf5; --blue:#1a6deb; --card:#fff; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Cairo, "IBM Plex Sans Arabic", Tahoma, sans-serif; background: linear-gradient(180deg, #eaf2ff, #f6f8fb); color: var(--ink); }
      .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 56px; }
      .hero { display: grid; gap: 8px; margin-bottom: 16px; }
      .hero .eyebrow { color: var(--blue); font-weight: 700; }
      .hero h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.3rem); letter-spacing: -0.04em; }
      .hero p { margin: 0; color: var(--muted); }
      .meta { color: var(--muted); font-size: .92rem; }
      .steps { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
      .steps span { padding: 6px 10px; border-radius: 999px; background: #eaf1fb; color: var(--muted); font-size: .82rem; font-weight: 700; }
      .steps span.on { background: var(--blue); color: #fff; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgba(19,52,100,.06); margin-bottom: 12px; }
      .svc, .staff-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; margin-bottom: 8px; cursor: pointer; text-align: start; font: inherit; color: inherit; }
      .svc.selected, .staff-row.selected { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,109,235,.15); }
      .stack label { display: grid; gap: 6px; margin-bottom: 10px; font-weight: 600; font-size: .92rem; }
      .stack input, .stack select, .stack textarea { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
      button.cta, button.ghost { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 800; cursor: pointer; font: inherit; }
      button.cta { background: linear-gradient(120deg,#0d4bb8,#1a6deb); color:#fff; }
      button.ghost { background: #eaf1fb; color: var(--ink); }
      button:disabled { opacity: .55; cursor: not-allowed; }
      .success { border-color: #b7e4c7; background: #f0fff4; }
      .foot { margin-top: 18px; color: var(--muted); font-size: .85rem; }
      .error { color: #b42318; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="wrap" id="app">جارٍ تحميل صفحة الحجز...</div>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const slug = params.get("slug") || "maw3ed-demo";
      const root = document.getElementById("app");
      const state = { step: 1, data: null, serviceId: "", staffId: "", customerName: "", phone: "", date: new Date().toISOString().slice(0, 10), time: "10:00", notes: "", result: null, error: "" };

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }

      function providersForService(service) {
        const ids = service?.providerIds || [];
        const staff = state.data?.staff || [];
        return ids.length ? staff.filter((person) => ids.includes(person.id)) : staff;
      }

      function render() {
        if (state.error && !state.data) {
          root.innerHTML = `<p class="error">${state.error}</p>`;
          return;
        }
        const page = state.data.page;
        const services = state.data.services || [];
        const service = services.find((item) => item.id === state.serviceId);
        const staffOptions = providersForService(service);

        root.innerHTML = `
          <section class="hero">
            <div class="eyebrow">${page.industry || "خدمة"}</div>
            <h1>${page.businessName || "موعد"}</h1>
            <p>${page.description || ""}</p>
            <div class="meta">${page.phone || ""} · ${page.email || ""}</div>
          </section>
          <div class="steps">
            <span class="${state.step === 1 ? "on" : ""}">1. الخدمة</span>
            <span class="${state.step === 2 ? "on" : ""}">2. الوقت والموظف</span>
            <span class="${state.step === 3 ? "on" : ""}">3. بياناتك</span>
            <span class="${state.step === 4 ? "on" : ""}">4. تأكيد</span>
          </div>
          ${state.step === 1 ? `
            <section class="card">
              <h2 style="margin-top:0">اختر خدمة</h2>
              ${services.map((item) => `
                <button type="button" class="svc ${state.serviceId === item.id ? "selected" : ""}" data-service="${item.id}">
                  <div><b>${item.name}</b><div class="meta">${item.durationMinutes} دقيقة${item.bufferMinutes ? ` · تجهيز ${item.bufferMinutes}د` : ""}</div></div>
                  <div><b>E£${item.price}</b></div>
                </button>
              `).join("") || "<p>لا توجد خدمات عامة حالياً.</p>"}
              <div class="actions"><button class="cta" id="to2" ${state.serviceId ? "" : "disabled"}>التالي</button></div>
            </section>
          ` : ""}
          ${state.step === 2 ? `
            <section class="card stack">
              <h2 style="margin-top:0">الموعد</h2>
              <label>التاريخ<input type="date" id="date" value="${state.date}" /></label>
              <label>الوقت<input type="time" id="time" value="${state.time}" /></label>
              <div>
                <b>الموظف / المقدّم</b>
                ${staffOptions.map((person) => `
                  <button type="button" class="staff-row ${state.staffId === person.id ? "selected" : ""}" data-staff="${person.id}">
                    <div><b>${person.name}</b><div class="meta">${person.title || ""}</div></div>
                  </button>
                `).join("") || "<p>لا يوجد موظفون متاحون.</p>"}
              </div>
              <div class="actions">
                <button class="ghost" id="back1">رجوع</button>
                <button class="cta" id="to3" ${state.staffId ? "" : "disabled"}>التالي</button>
              </div>
            </section>
          ` : ""}
          ${state.step === 3 ? `
            <section class="card stack">
              <h2 style="margin-top:0">بياناتك</h2>
              <label>الاسم الكامل<input id="name" required value="${state.customerName}" placeholder="مثال: أحمد علي" /></label>
              <label>الهاتف<input id="phone" value="${state.phone}" placeholder="+20..." /></label>
              <label>ملاحظات<textarea id="notes" rows="3">${state.notes}</textarea></label>
              <div class="actions">
                <button class="ghost" id="back2">رجوع</button>
                <button class="cta" id="to4">مراجعة</button>
              </div>
            </section>
          ` : ""}
          ${state.step === 4 ? `
            <section class="card ${state.result ? "success" : ""}">
              <h2 style="margin-top:0">${state.result ? "تم تأكيد الحجز" : "راجع طلبك"}</h2>
              ${state.result ? `
                <p>رقم المرجع: <b>${state.result.id}</b></p>
                <p>${state.result.serviceName} · ${state.result.date} · ${state.result.time}</p>
                <p>الحالة: ${state.result.status}</p>
              ` : `
                <p><b>${service?.name || ""}</b> · E£${service?.price ?? ""}</p>
                <p>${state.date} · ${state.time}</p>
                <p>${staffOptions.find((p) => p.id === state.staffId)?.name || ""}</p>
                <p>${state.customerName} · ${state.phone || "بدون هاتف"}</p>
                ${state.error ? `<p class="error">${state.error}</p>` : ""}
                <div class="actions">
                  <button class="ghost" id="back3">رجوع</button>
                  <button class="cta" id="submit">تأكيد الحجز</button>
                </div>
              `}
            </section>
          ` : ""}
          <p class="foot">${page.showPlatformBranding !== false ? "مدعوم من موعد · UpNexa-eg.com" : ""}</p>
        `;

        root.querySelectorAll("[data-service]").forEach((button) => button.addEventListener("click", () => {
          state.serviceId = button.getAttribute("data-service");
          const nextProviders = providersForService(services.find((item) => item.id === state.serviceId));
          state.staffId = nextProviders[0]?.id || "";
          render();
        }));
        root.querySelectorAll("[data-staff]").forEach((button) => button.addEventListener("click", () => {
          state.staffId = button.getAttribute("data-staff");
          render();
        }));
        document.getElementById("to2")?.addEventListener("click", () => { state.step = 2; render(); });
        document.getElementById("back1")?.addEventListener("click", () => { state.step = 1; render(); });
        document.getElementById("to3")?.addEventListener("click", () => {
          state.date = document.getElementById("date").value;
          state.time = document.getElementById("time").value;
          state.step = 3;
          render();
        });
        document.getElementById("back2")?.addEventListener("click", () => { state.step = 2; render(); });
        document.getElementById("to4")?.addEventListener("click", () => {
          state.customerName = document.getElementById("name").value.trim();
          state.phone = document.getElementById("phone").value.trim();
          state.notes = document.getElementById("notes").value.trim();
          if (!state.customerName) { alert("الاسم مطلوب"); return; }
          state.step = 4;
          state.error = "";
          render();
        });
        document.getElementById("back3")?.addEventListener("click", () => { state.step = 3; render(); });
        document.getElementById("submit")?.addEventListener("click", async () => {
          const button = document.getElementById("submit");
          button.disabled = true;
          try {
            const response = await fetch(`/api/public/booking/${encodeURIComponent(slug)}/appointments`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                customerName: state.customerName,
                phone: state.phone,
                serviceId: state.serviceId,
                staffId: state.staffId,
                date: state.date,
                time: state.time,
                notes: state.notes
              })
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.error || "فشل الحجز");
            state.result = payload.appointment;
            state.error = "";
          } catch (error) {
            state.error = error.message;
          }
          render();
        });
      }

      try {
        const response = await fetch(`/api/public/booking/${encodeURIComponent(slug)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "تعذر التحميل");
        state.data = data;
        state.serviceId = data.services?.[0]?.id || "";
        const first = data.services?.[0];
        const providers = (first?.providerIds?.length
          ? data.staff.filter((person) => first.providerIds.includes(person.id))
          : data.staff) || [];
        state.staffId = providers[0]?.id || "";
        render();
      } catch (error) {
        state.error = error.message;
        render();
      }
    </script>
  </body>
</html>
