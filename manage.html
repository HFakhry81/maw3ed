<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a6deb" />
    <title>إدارة الحجز — منصة موعد</title>
    <link rel="icon" type="image/svg+xml" href="/assets/maw3ed-icon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#13233f; --muted:#5b6b82; --line:#d7e0ec; --blue:#1a6deb; --card:#fff; --danger:#b42318; --ok:#0f7a45; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Cairo, "IBM Plex Sans Arabic", Tahoma, sans-serif; background: linear-gradient(180deg,#eaf2ff,#f6f8fb); color: var(--ink); }
      .skip { position: absolute; inset-inline-start: -999px; top: 0; background: #000; color: #fff; padding: 8px 12px; z-index: 10; }
      .skip:focus { inset-inline-start: 12px; top: 12px; }
      .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
      h1 { margin: 0 0 6px; font-size: clamp(1.4rem, 3vw, 1.9rem); letter-spacing: -.03em; }
      .muted { color: var(--muted); }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgba(19,52,100,.06); margin-top: 14px; }
      .row { display: grid; gap: 4px; margin-bottom: 10px; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
      button, .ghost { font: inherit; border-radius: 12px; padding: 12px 16px; font-weight: 800; cursor: pointer; border: 0; }
      .cta { background: linear-gradient(120deg,#0d4bb8,#1a6deb); color: #fff; }
      .danger { background: #fee4e2; color: var(--danger); }
      .ghost { background: #eaf1fb; color: var(--ink); }
      button:disabled { opacity: .55; cursor: not-allowed; }
      button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
        outline: 3px solid #1a6deb66; outline-offset: 2px;
      }
      label { display: grid; gap: 6px; font-weight: 700; margin-bottom: 10px; }
      input, select { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; }
      .err { color: var(--danger); font-weight: 700; }
      .ok { color: var(--ok); font-weight: 700; }
      .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #eef5ff; color: var(--blue); font-size: .8rem; font-weight: 700; }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">تخطّي إلى المحتوى</a>
    <main class="wrap" id="main">
      <p class="muted" id="status" role="status">جارٍ تحميل رابط الإدارة…</p>
    </main>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const slug = params.get("slug") || "";
      const token = params.get("token") || "";
      const root = document.getElementById("main");
      const apiBase = `/api/public/booking/${encodeURIComponent(slug)}/manage/${encodeURIComponent(token)}`;

      function esc(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      async function load() {
        if (!slug || !token) {
          root.innerHTML = `<p class="err" role="alert">رابط الإدارة ناقص (slug/token).</p>`;
          return;
        }
        try {
          const response = await fetch(apiBase);
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || "تعذر فتح الرابط");
          render(payload);
        } catch (error) {
          root.innerHTML = `<p class="err" role="alert">${esc(error.message)}</p>`;
        }
      }

      function render(data) {
        if (data.kind === "enrollment") {
          const e = data.enrollment || {};
          root.innerHTML = `
            <p class="badge">تسجيل جلسة</p>
            <h1>${esc(data.businessName || "موعد")}</h1>
            <p class="muted">إدارة التسجيل عبر رابط موقّع ومحدود العمر — منفصل عن بطاقة الحضور.</p>
            <section class="card" aria-labelledby="enroll-title">
              <h2 id="enroll-title" style="margin-top:0">${esc(e.serviceName || "جلسة")}</h2>
              <div class="row"><span class="muted">العميل</span><b>${esc(e.customerName)}</b></div>
              <div class="row"><span class="muted">البداية</span><b>${esc(e.startsAt || "—")}</b></div>
              <div class="row"><span class="muted">المقاعد</span><b>${esc(e.seats)}</b></div>
              <div class="row"><span class="muted">الحالة</span><b>${esc(e.status)}</b></div>
              <p class="muted">ينتهي الرابط: ${esc(data.expiresAt || "")}</p>
              <div class="actions">
                <button type="button" class="danger" id="cancel" ${data.canCancel ? "" : "disabled"}>إلغاء التسجيل</button>
              </div>
              <p id="msg" class="muted" role="status" aria-live="polite"></p>
            </section>`;
          document.getElementById("cancel")?.addEventListener("click", () => act("cancel"));
          return;
        }

        const a = data.appointment || {};
        root.innerHTML = `
          <p class="badge">إدارة الموعد</p>
          <h1>${esc(data.businessName || "موعد")}</h1>
          <p class="muted">إلغاء أو إعادة جدولة برابط موقّع — لا يمنح رمز الحضور هذه الصلاحية.</p>
          <section class="card" aria-labelledby="appt-title">
            <h2 id="appt-title" style="margin-top:0">${esc(a.serviceName || "موعد")}</h2>
            <div class="row"><span class="muted">العميل</span><b>${esc(a.customerName)}</b></div>
            <div class="row"><span class="muted">الموعد</span><b>${esc(a.date)} · ${esc(a.time)}</b></div>
            <div class="row"><span class="muted">المقدم</span><b>${esc(a.staffName || "—")}</b></div>
            <div class="row"><span class="muted">الحالة</span><b>${esc(a.status)}</b></div>
            <p class="muted">ينتهي الرابط: ${esc(data.expiresAt || "")}</p>
            <div class="actions">
              <button type="button" class="danger" id="cancel" ${data.canCancel ? "" : "disabled"}>إلغاء الموعد</button>
              <button type="button" class="cta" id="toggle-reschedule" ${data.canReschedule ? "" : "disabled"}>إعادة الجدولة</button>
            </div>
            <form id="reschedule-form" class="card" style="display:none;margin-top:12px;box-shadow:none" aria-label="إعادة جدولة">
              <label>التاريخ الجديد<input type="date" id="date" required value="${esc(a.date || "")}" /></label>
              <label>الوقت الجديد (HH:MM)<input type="time" id="time" required value="${esc(a.time || "")}" /></label>
              <div class="actions">
                <button type="submit" class="cta">تأكيد إعادة الجدولة</button>
                <button type="button" class="ghost" id="hide-reschedule">إخفاء</button>
              </div>
            </form>
            <p id="msg" class="muted" role="status" aria-live="polite"></p>
          </section>`;

        document.getElementById("cancel")?.addEventListener("click", () => act("cancel"));
        document.getElementById("toggle-reschedule")?.addEventListener("click", () => {
          const form = document.getElementById("reschedule-form");
          form.style.display = form.style.display === "none" ? "block" : "none";
          if (form.style.display === "block") document.getElementById("date")?.focus();
        });
        document.getElementById("hide-reschedule")?.addEventListener("click", () => {
          document.getElementById("reschedule-form").style.display = "none";
        });
        document.getElementById("reschedule-form")?.addEventListener("submit", async (event) => {
          event.preventDefault();
          await act("reschedule", {
            date: document.getElementById("date").value,
            time: document.getElementById("time").value
          });
        });
      }

      async function act(action, body = {}) {
        const msg = document.getElementById("msg");
        msg.className = "muted";
        msg.textContent = "جارٍ التنفيذ…";
        try {
          const path = action === "cancel" ? `${apiBase}/cancel` : `${apiBase}/reschedule`;
          const response = await fetch(path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || "تعذر تنفيذ العملية");
          msg.className = "ok";
          msg.textContent = action === "cancel" ? "تم الإلغاء بنجاح." : "تمت إعادة الجدولة بنجاح.";
          window.setTimeout(load, 700);
        } catch (error) {
          msg.className = "err";
          msg.textContent = error.message;
        }
      }

      load();
    </script>
  </body>
</html>
