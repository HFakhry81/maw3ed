<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>بطاقة حضور — موعد</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root { --ink:#0d1b2a; --blue:#1a6deb; --muted:#6b7d8e; --line:#e2e8f0; --olive:#a8c73a; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: Cairo, Tahoma, sans-serif;
      background: linear-gradient(180deg, #eef3fa, #f4f7fb);
      color: var(--ink); display: grid; place-items: center; padding: 24px;
    }
    .card {
      width: min(420px, 100%); background: #fff; border: 1px solid var(--line);
      border-radius: 16px; padding: 22px; box-shadow: 0 12px 28px rgba(13,27,42,.08);
      text-align: center; display: grid; gap: 10px;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    .muted { color: var(--muted); font-size: .9rem; }
    #qr { margin: 12px auto; width: 220px; height: 220px; }
    .badge {
      display: inline-block; padding: 4px 10px; border-radius: 999px;
      background: #e8f1ff; color: var(--blue); font-weight: 700; font-size: .8rem;
    }
    .badge.ok { background: #f3f7e6; color: #5c7a18; }
    .notice {
      margin: 0; padding: 12px; border-radius: 12px;
      background: #fff7ed; border: 1px solid #fdba74; color: #9a3412;
      font-weight: 700; line-height: 1.6;
    }
    .download-pdf {
      border: 0; border-radius: 12px; padding: 14px 16px;
      background: var(--blue); color: #fff; font: inherit; font-weight: 800;
      cursor: pointer; width: 100%;
    }
    .download-pdf:hover { filter: brightness(1.05); }
    code { font-size: .72rem; word-break: break-all; color: var(--muted); }
  </style>
</head>
<body>
  <article class="card" id="root">
    <p class="muted">جارٍ تحميل بطاقة الحضور…</p>
  </article>
  <script>
    function pdfBytes(parts) {
      const encoder = new TextEncoder();
      const chunks = parts.map((part) => (typeof part === "string" ? encoder.encode(part) : part));
      const total = chunks.reduce((sum, chunk) => sum + chunk.length, 0);
      const out = new Uint8Array(total);
      let offset = 0;
      chunks.forEach((chunk) => {
        out.set(chunk, offset);
        offset += chunk.length;
      });
      return out;
    }

    function jpegPdfBytes(jpegBytes, pixelWidth, pixelHeight) {
      const pageWidth = 595;
      const pageHeight = 842;
      const margin = 36;
      const maxW = pageWidth - margin * 2;
      const maxH = pageHeight - margin * 2;
      const scale = Math.min(maxW / pixelWidth, maxH / pixelHeight);
      const drawW = pixelWidth * scale;
      const drawH = pixelHeight * scale;
      const x = (pageWidth - drawW) / 2;
      const y = (pageHeight - drawH) / 2;
      const content = `q\n${drawW.toFixed(2)} 0 0 ${drawH.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm\n/Im0 Do\nQ\n`;
      const objects = [
        "1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n",
        "2 0 obj\n<< /Type /Pages /Count 1 /Kids [3 0 R] >>\nendobj\n",
        "3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents 4 0 R /Resources << /XObject << /Im0 5 0 R >> >> >>\nendobj\n",
        `4 0 obj\n<< /Length ${content.length} >>\nstream\n${content}endstream\nendobj\n`
      ];
      const imageHead = `5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pixelWidth} /Height ${pixelHeight} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`;
      const imageTail = "\nendstream\nendobj\n";
      const header = "%PDF-1.3\n";
      const encoder = new TextEncoder();
      let cursor = encoder.encode(header).length;
      const offsets = objects.map((body) => {
        const start = cursor;
        cursor += encoder.encode(body).length;
        return start;
      });
      const imageOffset = cursor;
      cursor += encoder.encode(imageHead).length + jpegBytes.length + encoder.encode(imageTail).length;
      const xrefStart = cursor;
      let xref = `xref\n0 6\n0000000000 65535 f \n`;
      offsets.forEach((offset) => {
        xref += `${String(offset).padStart(10, "0")} 00000 n \n`;
      });
      xref += `${String(imageOffset).padStart(10, "0")} 00000 n \n`;
      xref += `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
      return pdfBytes([header, ...objects, imageHead, jpegBytes, imageTail, xref]);
    }

    function downloadPassPdf(details) {
      const card = document.createElement("canvas");
      card.width = 800;
      card.height = 1120;
      const ctx = card.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, card.width, card.height);
      ctx.fillStyle = "#0d1b2a";
      ctx.textAlign = "center";
      ctx.direction = "rtl";
      ctx.font = "700 40px Tahoma, sans-serif";
      ctx.fillText(details.businessName, 400, 90);
      ctx.font = "600 34px Tahoma, sans-serif";
      ctx.fillText(details.customerName, 400, 160);
      ctx.fillStyle = "#4b6178";
      ctx.font = "28px Tahoma, sans-serif";
      ctx.fillText(details.serviceName, 400, 220);
      ctx.fillText(details.whenLabel, 400, 270);
      if (details.staffName) ctx.fillText(`مع: ${details.staffName}`, 400, 320);
      ctx.drawImage(details.qrCanvas, 160, 370, 480, 480);
      ctx.fillStyle = "#0d4bb8";
      ctx.font = "700 30px Tahoma, sans-serif";
      ctx.fillText("لموظف الاستقبال: امسح الرمز لتسجيل الحضور", 400, 920);
      ctx.fillStyle = "#9a3412";
      ctx.font = "26px Tahoma, sans-serif";
      ctx.fillText("لا يتم تسجيل الحضور بدون هذا الرمز", 400, 980);
      const jpeg = atob(card.toDataURL("image/jpeg", 0.92).split(",")[1]);
      const bytes = new Uint8Array(jpeg.length);
      for (let i = 0; i < jpeg.length; i += 1) bytes[i] = jpeg.charCodeAt(i);
      const pdf = jpegPdfBytes(bytes, card.width, card.height);
      const file = new Blob([pdf], { type: "application/pdf" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(file);
      link.download = details.filename || "maw3ed-checkin.pdf";
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1500);
    }

    (async function () {
      const params = new URLSearchParams(location.search);
      const slug = params.get("slug") || "";
      const token = params.get("token") || "";
      const root = document.getElementById("root");
      if (!slug || !token) {
        root.innerHTML = "<h1>رابط غير صالح</h1><p class='muted'>بطاقة الحضور تحتاج slug و token.</p>";
        return;
      }
      try {
        const res = await fetch(`/api/public/booking/${encodeURIComponent(slug)}/pass/${encodeURIComponent(token)}`);
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "تعذر تحميل البطاقة");
        const appt = data.appointment;
        const passUrl = `${location.origin}/pass.html?slug=${encodeURIComponent(slug)}&token=${encodeURIComponent(token)}`;
        const checked = Boolean(appt.checkedInAt);
        root.innerHTML = `
          <div class="badge ${checked ? "ok" : ""}">${checked ? "تم الحضور" : "بطاقة حضور"}</div>
          <h1>${data.businessName || "موعد"}</h1>
          <p><b>${appt.customerName}</b></p>
          <p class="muted">${appt.serviceName || ""} · ${appt.categoryName || ""}</p>
          <p>${appt.date} · ${appt.time}</p>
          <p class="muted">مع: ${appt.staffName || "—"}</p>
          <div id="qr"></div>
          <p class="notice">أظهر هذا الرمز لموظف الاستقبال عند الوصول. لا يتم تسجيل الحضور بدون رمز QR المحفوظ.</p>
          <button type="button" class="download-pdf" id="download-pdf">تحميل QR Code كملف PDF</button>
          <code>${token}</code>
        `;
        if (typeof QRCode !== "function") throw new Error("تعذر تحميل مولد QR");
        const qrHost = document.getElementById("qr");
        qrHost.innerHTML = "";
        new QRCode(qrHost, { text: passUrl, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
        document.getElementById("download-pdf").addEventListener("click", () => {
          const qrCanvas = qrHost.querySelector("canvas");
          if (!qrCanvas) {
            window.alert("تعذر تجهيز الرمز للتنزيل");
            return;
          }
          downloadPassPdf({
            filename: "maw3ed-checkin.pdf",
            businessName: data.businessName || "موعد",
            customerName: appt.customerName || "",
            serviceName: appt.serviceName || "",
            whenLabel: `${appt.date || ""} · ${appt.time || ""}`,
            staffName: appt.staffName || "",
            qrCanvas
          });
        });
      } catch (error) {
        root.innerHTML = `<h1>تعذر العرض</h1><p class="muted">${error.message || error}</p>`;
      }
    })();
  </script>
</body>
</html>
