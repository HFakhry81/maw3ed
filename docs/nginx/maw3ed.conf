# Example Nginx server block for Maw3ed on the VPS.
# App listens on 127.0.0.1:7000 only. Do NOT proxy public traffic to Vite :7100.
# Replace server_name; after certbot, TLS listen 443 blocks are usually injected automatically.

# Redirect HTTP → HTTPS (enable after first certificate exists)
server {
    listen 80;
    server_name maw3ed.upnexa-eg.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name maw3ed.upnexa-eg.com;

    # certbot paths (example — actual paths come from certbot):
    # ssl_certificate     /etc/letsencrypt/live/maw3ed.upnexa-eg.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/maw3ed.upnexa-eg.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff always;
    }
}

