<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="UpNexa-eg.com" />
    <title>خطط موعد Maw3ed</title>
    <style>
      :root { font-family: Arial, sans-serif; color: #071942; background: #f4f8ff; } * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; } .wrap { width: min(1100px, 100%); margin: auto; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 34px; }
      .brand { display: flex; align-items: center; gap: 12px; }.brand img { width: 48px; }.brand strong { display:block; font-size: 22px; }.brand span { color: #72809b; font-size: 11px; }
      .back { color: #1769e8; text-decoration: none; font-weight: 700; font-size: 13px; }
      h1 { font-size: clamp(28px, 5vw, 48px); margin: 20px 0 10px; }.intro { color: #6d7b94; max-width: 650px; line-height: 1.8; }
      .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 30px; }.plan { background:#fff; border:1px solid #e0e9f7; border-radius:22px; padding:24px; min-height:360px; display:flex; flex-direction:column; box-shadow:0 18px 50px rgba(28,69,130,.08); }.plan.featured { border:2px solid #1769e8; transform: translateY(-8px); }.badge { color:#1769e8; font-weight:700; font-size:11px; }.plan h2 { margin:12px 0 8px; }.price { font-size:32px; font-weight:800; margin:12px 0; }.price small { color:#72809b; font-size:12px; font-weight:400; }.desc { color:#72809b; line-height:1.7; min-height:48px; }.features { list-style:none; padding:0; margin:20px 0; color:#53627e; line-height:2; font-size:13px; flex:1; }.features li::before { content:"✓"; color:#16a975; font-weight:700; margin-left:7px; }.cta { border:0; border-radius:10px; padding:12px; color:#fff; background:#1769e8; font-weight:700; cursor:pointer; }.free .cta { background:#eaf2ff; color:#1769e8; }.note { min-height:22px; color:#6d7b94; font-size:12px; margin-top:22px; }
      @media (max-width: 800px) { body { padding:18px; }.plans { grid-template-columns:1fr; }.plan.featured { transform:none; } header { align-items:flex-start; } }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header><div class="brand"><img src="/assets/maw3ed-icon.svg" alt="Maw3ed" /><div><strong>موعد Maw3ed</strong><span>خطط مرنة لكل نشاط</span></div></div><a class="back" href="/">لوحة التحكم</a></header>
      <h1>اختر الخطة المناسبة لنشاطك</h1>
      <p class="intro">ابدأ مجاناً. عند اختيار Pro أو Ultimate يتم إرسال طلب إلى مسؤول المنصة للمراجعة والتأكيد المؤقت، بدون تفعيل دفع تلقائي.</p>
      <section class="plans" id="plans"></section>
      <p class="note" id="planNote"></p>
    </main>
    <script src="/plans.js"></script>
  </body>
</html>
